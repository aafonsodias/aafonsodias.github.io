<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:800px;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:linear-gradient(135deg,#5b5bd6 0%,#8b5cf6 55%,#c084fc 100%);display:flex;align-items:center;justify-content:space-between;padding:0 96px;box-sizing:border-box;color:#fff}
.copy{max-width:520px}
h1{font-size:44px;line-height:1.1;margin:0 0 18px;letter-spacing:-.02em;font-weight:800}
p{font-size:21px;line-height:1.45;margin:0;opacity:.92}
.frame{width:420px;height:600px;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(20,10,60,.45),0 2px 6px rgba(0,0,0,.2);background:#fff;flex:none}
.frame.wide{width:640px;height:620px}
iframe{border:0;width:100%;height:100%;display:block}
</style></head><body>
<div class="copy"><h1 id="h"></h1><p id="p"></p></div>
<div class="frame" id="f"><iframe id="i"></iframe></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('h').textContent=q.get('h');document.getElementById('p').textContent=q.get('p');
document.getElementById('i').src=q.get('src');if(q.get('wide'))document.getElementById('f').classList.add('wide');
</script></body></html>
