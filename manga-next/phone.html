  function cadence(s) { if (s.cd) { const d = s.cd, wd = s.wd != null ? t('onWeekday', weekdayName(s.wd)) : ''; if (d >= 6 && d <= 8) return t('weekly') + wd; if (d >= 13 && d <= 15) return t('biweekly') + wd; if (d >= 20 && d <= 23) return t('triweekly'); if (d >= 27 && d <= 33) return t('monthly'); return t('everyDays', Math.round(d)); } return s.r || ''; }
  function relDays(ts, now) { const d = Math.round((startOfDay(ts) - startOfDay(now)) / DAY); if (d === 0) return t('today'); if (d === 1) return t('tomorrow'); if (d === -1) return t('yesterday'); return d > 1 ? t('inDays', d) : t('daysAgo', -d); }
  function ago(ts, now) { const m = Math.max(0, Math.round((now - ts) / 60000)); if (m < 60) return t('minAgo', m); const h = Math.round(m / 60); if (h < 48) return t('hAgo', h); return t('daysAgo', Math.round(h / 24)); }
  function el(tag, attrs = {}, text) { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === 'class') n.className = v; else n.setAttribute(k, v); } if (text != null) n.textContent = text; return n; }

  function classify(s, now) {
    const fresh = s.l != null && s.c != null && s.l > s.c;
    if (fresh) return 'new';
    if (s.st === 'completed' || s.st === 'cancelled') return 'done';
    if (s.st === 'hiatus' || s.st === 'break') return 'quiet';
    return s.x ? 'soon' : 'unknown';
  }
  const SECTIONS = [['new', 'secNew'], ['soon', 'secSoon'], ['quiet', 'secQuiet'], ['done', 'secDone'], ['unknown', 'secUnknown']];

  async function render() {
    const data = await load();
    const now = Date.now();
    const list = $('list'); list.textContent = '';
    $('filter').setAttribute('aria-pressed', String(newOnly));
    $('filter').textContent = t('newOnly');
    if (!data) {
      $('sub').textContent = '';
      const box = el('div', { class: 'empty' });
      box.appendChild(el('strong', {}, t('nothingYet')));
      box.append(t('howGet'));
      list.appendChild(box);
      $('foot').textContent = '';
      return;
    }
    if (window.matchMedia('(min-width: 700px)').matches && location.hash.length > 10) list.appendChild(howto());
    const rows = data.s.map((s) => ({ s, k: classify(s, now) })).sort((a, b) => (a.s.x || 9e15) - (b.s.x || 9e15));
    const n = rows.filter((r) => r.k === 'new').length;
    $('sub').textContent = t('sub', data.s.length, n, ago(data.t, now));
    const visible = newOnly ? rows.filter((r) => r.k === 'new') : rows;
    if (!visible.length) {
      const box = el('div', { class: 'empty' });
      box.appendChild(el('strong', {}, t('nothingNew')));
      box.append(t('caughtUp'));
      list.appendChild(box);
    }
    for (const [id, label] of SECTIONS) {
      const items = visible.filter((r) => r.k === id);
      if (!items.length) continue;
      if (!newOnly) { const h = el('div', { class: 'section' }, t(label)); h.appendChild(el('span', { class: 'count' }, String(items.length))); list.appendChild(h); }
      for (const { s, k } of items) list.appendChild(row(s, k, now));
    }
    $('foot').textContent = t('foot');
  }

  // Shown on a computer screen: this page is meant for the phone, here is how to get it there.
  function howto() {
    const box = el('div', { class: 'howto' });
    box.appendChild(el('strong', {}, t('ready')));
    const ol = el('ol');
    ol.appendChild(el('li', {}, t('qr')));
    ol.appendChild(el('li', {}, t('send')));
    ol.appendChild(el('li', {}, t('copyHow')));
    box.appendChild(ol);
    const acts = el('div', { class: 'acts' });
    const copy = el('button', {}, t('copy'));
    copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(location.href); copy.textContent = t('copied'); setTimeout(() => (copy.textContent = t('copy')), 1500); } catch { prompt(t('copyPrompt'), location.href); } });
    acts.appendChild(copy);
    if (navigator.share) { const sh = el('button', { class: 'quiet' }, t('share')); sh.addEventListener('click', () => navigator.share({ title: 'Manga Next', url: location.href }).catch(() => {})); acts.appendChild(sh); }
    const hide = el('button', { class: 'quiet' }, t('hide'));
    hide.addEventListener('click', () => box.remove());
    acts.appendChild(hide);
    box.appendChild(acts);
    box.appendChild(el('div', { class: 'sub', style: 'margin-top:8px' }, t('travels')));
    return box;
  }

  function row(s, k, now) {
    const r = el('div', { class: `row${k === 'new' ? ' new' : k === 'quiet' ? ' warn' : ''}` });
    const cv = safe(s.cv);
    if (cv) { const c = el('div', { class: 'cover' }); const img = el('img', { src: cv, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' }); img.addEventListener('error', () => c.remove()); c.appendChild(img); r.appendChild(c); }
    const body = el('div', { class: 'body' });
    const title = el('div', { class: 'title' });
    title.appendChild(el('span', { class: 'name' }, s.n));
    if (k === 'new') title.appendChild(el('span', { class: 'pill' }, t('pillNew', s.l)));
    else if (s.st === 'completed' || s.st === 'cancelled') title.appendChild(el('span', { class: 'pill muted' }, t('pillDone')));
    else if (s.st === 'hiatus') title.appendChild(el('span', { class: 'pill warn' }, t('pillHiatus')));
    else if (s.st === 'break') title.appendChild(el('span', { class: 'pill warn' }, t('pillBreak')));
    body.appendChild(title);
    const meta = el('div', { class: 'meta' });
    meta.append(t('you') + ' '); meta.appendChild(el('b', {}, s.c != null ? String(s.c) : '?'));
    meta.append('  ' + t('latest') + ' '); meta.appendChild(el('b', {}, s.l != null ? String(s.l) : '?'));
    if (s.ld) meta.append(` (${relDays(s.ld, now)})`);
    body.appendChild(meta);
    let text = '', tone = '';
    if (s.st === 'completed') text = t('completed');
    else if (s.st === 'hiatus') text = t('hiatus'), tone = 'warn';
    else if (s.st === 'break') text = t('brk'), tone = 'warn';
    else if (s.x) { const rel = relDays(s.x, now); const c = cadence(s); text = t('next', fmtDate(s.x), rel) + (c ? ` · ${c}` : ''); tone = rel === t('today') || rel === t('tomorrow') ? 'ok' : ''; }
    else text = t('noHistory');
    body.appendChild(el('div', { class: `next ${tone}` }, text));
    const actions = el('div', { class: 'actions' });
    const nu = safe(s.nu), u = safe(s.u);
    if (k === 'new' && (nu || u)) actions.appendChild(el('a', { class: 'btn', href: nu || u }, t('readCh', s.nc)));
    if (u) actions.appendChild(el('a', { class: 'btn quiet', href: u }, k === 'new' ? t('yourBookmark') : t('open')));
    body.appendChild(actions);
    r.appendChild(body);
    return r;
  }

  $('filter').addEventListener('click', () => { newOnly = !newOnly; try { localStorage.setItem(KEY + ':newOnly', newOnly ? '1' : '0'); } catch {} render(); });
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
