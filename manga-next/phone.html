  const LANG = (navigator.language || 'en').toLowerCase().split('-')[0];
  const W = L[LANG] || L.en;

  const KEY = 'manga-next-phone';
  const $ = (id) => document.getElementById(id);
  let newOnly = false;
  try { newOnly = localStorage.getItem(KEY + ':newOnly') === '1'; } catch {}

  async function fromFragment() {
    const m = location.hash.match(/[#&]([dzq])=([A-Za-z0-9_-]+)/i);
    if (!m) return null;
    try {
      let bytes;
      if (m[1].toLowerCase() === 'q') bytes = b32dec(m[2]);
      else {
        const b64 = m[2].replace(/-/g, '+').replace(/_/g, '/');
        const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
        bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
      }
      if (m[1].toLowerCase() !== 'd') {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        bytes = new Uint8Array(await new Response(stream).arrayBuffer());
      }
      const data = JSON.parse(new TextDecoder().decode(bytes));
      if (data && data.v === 1 && Array.isArray(data.s)) return data;
      if (data && data.v === 2 && Array.isArray(data.a)) {
        data.s = data.a.map(([n, c, u, l, xd, st, nc]) => ({ n, c, u, l, x: xd != null ? data.t + xd * DAY : null, st, nc }));

      }

    return null;
  }
  async function load() {
    const fresh = await fromFragment();
    if (fresh) {
      try { localStorage.setItem(KEY, JSON.stringify(fresh)); } catch {}

    }
    try { const s = localStorage.getItem(KEY); if (s) return JSON.parse(s); } catch {}

  // Same rule as the extension: swap the chapter number in the bookmark's address.
  function bump(url, from, to) {

      const p = new URL(url);
      const re = /((?:chapter|chap|ch|episode|ep)[-_/]?)(\d+(?:[.-]\d+)?)(?=[/?#]|$)/i;

  function startOfDay(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); }

  function cadence(s) { if (s.cd) { const d = s.cd, wd = s.wd != null ? t('onWeekday', weekdayName(s.wd)) : ''; if (d >= 6 && d <= 8) return t('weekly') + wd; if (d >= 13 && d <= 15) return t('biweekly') + wd; if (d >= 20 && d <= 23) return t('triweekly'); if (d >= 27 && d <= 33) return t('monthly'); return t('everyDays', Math.round(d)); } return s.r || ''; }

  function classify(s, now) {
    const fresh = s.l != null && s.c != null && s.l > s.c;
    if (fresh) return 'new';
    if (s.st === 'completed' || s.st === 'cancelled') return 'done';

  const SECTIONS = [['new', 'secNew'], ['soon', 'secSoon'], ['quiet', 'secQuiet'], ['done', 'secDone'], ['unknown', 'secUnknown']];

  let showList = false;
  async function render(list_) {
    if (list_) showList = true;

    const n = rows.filter((r) => r.k === 'new').length;
    $('sub').textContent = t('sub', data.s.length, n, ago(data.t, now));

  // The QR code is drawn on a computer only; the encoder (qrcode.js, MIT, Kazuhiko Arase) loads on demand.

  function loadQr() {

  // The QR carries a slim copy of the list (names, chapters, reading links): fewer modules, easier to scan

  // Base32 (uppercase, no padding) lets the QR use its alphanumeric mode: fewer modules than base64.
  const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  function b32enc(bytes) { let out = '', bits = 0, acc = 0; for (const b of bytes) { acc = (acc << 8) | b; bits += 8; while (bits >= 5) { out += B32[(acc >>> (bits - 5)) & 31]; bits -= 5; } } if (bits) out += B32[(acc << (5 - bits)) & 31]; return out; }

  async function slimLink(data) {

    const rows = data.s.map((x) => [x.n, x.c, x.u, x.l, x.x ? Math.round((x.x - data.t) / DAY) : null, x.st, x.nc]);
    const slim = { v: 2, t: data.t, f: data.f, b: data.b ? 1 : 0, a: rows };

  async function drawQr(box, data) {

    else if (s.st === 'hiatus') text = t('hiatus'), tone = 'warn';
    else if (s.st === 'break') text = t('brk'), tone = 'warn';
    else if (s.x) { const rel = relDays(s.x, now); const c = cadence(s); text = t('next', fmtDate(s.x), rel) + (c ? ` · ${c}` : ''); tone = rel === t('today') || rel === t('tomorrow') ? 'ok' : ''; }
    else text = t('noHistory');
    body.appendChild(el('div', { class: `next ${tone}` }, text));
    const actions = el('div', { class: 'actions' });
    const u = safe(s.u), nu = safe(s.nu) || (s.nc != null ? bump(u, s.c, s.nc) : null);
    if (k === 'new' && (nu || u)) actions.appendChild(el('a', { class: 'btn', href: nu || u }, t('readCh', s.nc)));
    if (u) actions.appendChild(el('a', { class: 'btn quiet', href: u }, k === 'new' ? t('yourBookmark') : t('open')));
    body.appendChild(actions);
    r.appendChild(body);
    return r;
  }

  $('filter').addEventListener('click', () => { newOnly = !newOnly; try { localStorage.setItem(KEY + ':newOnly', newOnly ? '1' : '0'); } catch {} render(); });
  window.addEventListener('hashchange', render);
  render();
})();
</script>
</body>
</html>
